[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-env"
version = "1.0.0"
description = "Multi-Asset Portfolio Trading RL Environment using real NSE data"
authors = [
    {name = "Atharva", email = "atharva@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core] @ git+https://github.com/meta-pytorch/OpenEnv.git@v0.2.3",
    "gymnasium==0.29.1",
    "yfinance",
    "numpy",
    "pandas",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
server = "server.app:main"

[project.urls]
Homepage = "https://huggingface.co/spaces/20atharva26/finance-env"
Repository = "https://github.com/atharva07-SYS/finance_env"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "server*"]